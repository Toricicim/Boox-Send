name: Draft release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build universal package
        env:
          BOOX_SEND_ARCHS: arm64 x86_64
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: build/release/*-macOS-universal.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/boox-send-release.jks"
      - name: Build signed release APK
        env:
          BOOX_SEND_ANDROID_VARIANT: release
          BOOX_SEND_KEYSTORE: ${{ runner.temp }}/boox-send-release.jks
          BOOX_SEND_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BOOX_SEND_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BOOX_SEND_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/build-android.sh
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/release/BOOX-Send-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: build/release/BOOX-Send-android.apk

  release:
    needs: [macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
