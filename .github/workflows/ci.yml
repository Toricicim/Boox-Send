name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate plist and Swift sources
        run: |
          plutil -lint macos/BooxSend/Info.plist
          plutil -lint "macos/QuickAction/BOOX’a Gönder.workflow/Contents/Info.plist"
          plutil -lint "macos/QuickAction/BOOX’a Gönder.workflow/Contents/document.wflow"
          xcrun swiftc -typecheck -framework SwiftUI -framework AppKit -framework IOBluetooth -framework UserNotifications macos/Shared/*.swift macos/BooxSend/*.swift
      - name: Build native macOS app
        run: ./scripts/build-macos.sh
      - name: Verify signature
        run: codesign --verify --deep --strict "build/release/BOOX Send.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ runner.arch }}
          path: build/release/BOOX Send.app

  android:
    name: Android test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test and build APK
        run: ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: build/release/BOOX-Send-android-debug.apk
