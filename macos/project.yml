name: BooxSend
options:
  bundleIdPrefix: com.aliumutaltas
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  BooxSend:
    type: application
    platform: macOS
    sources:
      - path: BooxSend
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliumutaltas.BooxSend
        INFOPLIST_FILE: BooxSend/Info.plist
        CODE_SIGN_ENTITLEMENTS: BooxSend/BooxSend.entitlements
        ENABLE_APP_SANDBOX: YES
    dependencies:
      - framework: IOBluetooth.framework
      - target: BooxSendFinder
        embed: true
  BooxSendFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: BooxSendFinder
      - path: Shared/SharedQueue.swift
      - path: Shared/Constants.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliumutaltas.BooxSend.Finder
        INFOPLIST_FILE: BooxSendFinder/Info.plist
        CODE_SIGN_ENTITLEMENTS: BooxSendFinder/BooxSendFinder.entitlements
        ENABLE_APP_SANDBOX: YES
        APPLICATION_EXTENSION_API_ONLY: NO
  BooxSendTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliumutaltas.BooxSendTests
    dependencies:
      - target: BooxSend
schemes:
  BooxSend:
    build:
      targets:
        BooxSend: all
        BooxSendFinder: all
        BooxSendTests: [test]
